<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexora: Discover more. Shop smarter. Stay protected.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12202E; --ink2:#4A5C6D; --paper:#F3F6F7; --card:#FFFFFF; --rule:#D8E0E5;
  --teal:#0B7F86; --teal-d:#085F65; --on-teal:#FFFFFF; --saffron:#F2A33A; --coral:#C93E22; --ok:#1C8A57;
  --hero:#12202E; --hero-fg:#F3F6F7; --tl:91%; --ts:42%; --shadow:0 1px 2px rgba(18,32,46,.08);
  --f-head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8EEF2; --ink2:#9FB0BD; --paper:#0C141B; --card:#15202A; --rule:#273644;
    --teal:#3CC1C8; --teal-d:#7AD9DE; --on-teal:#06262A; --coral:#FF8A6E; --ok:#4CC388;
    --hero:#0A2A33; --tl:24%; --ts:30%; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EEF2; --ink2:#9FB0BD; --paper:#0C141B; --card:#15202A; --rule:#273644;
  --teal:#3CC1C8; --teal-d:#7AD9DE; --on-teal:#06262A; --coral:#FF8A6E; --ok:#4CC388;
  --hero:#0A2A33; --tl:24%; --ts:30%; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--f-body);min-height:100%}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;letter-spacing:-.01em;line-height:1.15}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font:800 24px var(--f-head);letter-spacing:-.03em;color:var(--ink)}
.search{position:relative;flex:1 1 320px;display:flex;gap:8px;min-width:0}
.search input{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.sugg{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:40}
.sugg button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px}
.sugg button:hover,.sugg button:focus-visible{background:var(--paper)}
.acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.hbtn{background:none;border:0;padding:8px 10px;border-radius:8px;display:flex;gap:6px;align-items:center;font-weight:500}
.hbtn:hover{background:var(--paper)}
.cnt{background:var(--saffron);color:#12202E;border-radius:999px;font-size:12px;font-weight:700;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 5px}
.cnt:empty,.cnt[data-n="0"]{display:none}
.cats{border-top:1px solid var(--rule);overflow-x:auto;white-space:nowrap}
.cats .wrap{display:flex;gap:2px;padding-top:2px;padding-bottom:2px}
.cats button{background:none;border:0;padding:9px 12px;border-bottom:3px solid transparent;font-weight:500;color:var(--ink2)}
.cats button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--teal)}
.cats button:hover{color:var(--ink)}
.cats .sp{flex:1}

/* buttons */
.btn{background:var(--teal);color:var(--on-teal);border:0;border-radius:8px;padding:10px 18px;font-weight:600;line-height:1.2}
.btn:hover{background:var(--teal-d);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--ink2)}
.btn.sec:hover{background:var(--paper);color:var(--ink)}
.btn.warn{background:var(--saffron);color:#12202E}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--coral);border:1px solid var(--coral)}
.link{background:none;border:0;padding:0;color:var(--teal-d);text-decoration:underline;font-weight:500}
.ico{width:36px;height:36px;border-radius:8px;background:transparent;border:1px solid var(--rule);display:grid;place-items:center;font-size:16px;color:var(--ink2)}
.ico[aria-pressed="true"]{color:var(--coral);border-color:var(--coral)}
.ico.cmp[aria-pressed="true"]{color:var(--teal-d);border-color:var(--teal)}
.ico:hover{border-color:var(--ink2)}

/* hero */
.hero{background:var(--hero);color:var(--hero-fg);padding:44px 0 40px}
.hero-g{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(36px,5.2vw,64px);font-weight:800;letter-spacing:-.035em}
.lead{font-size:18px;max-width:46ch;color:#C5D2DB;margin:18px 0}
.hero-pts{display:flex;flex-wrap:wrap;gap:8px 18px;color:#C5D2DB;font-size:15px}
.assist{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:20px}
.assist label{font:700 18px var(--f-head);display:block;margin-bottom:10px}
.arow{display:flex;gap:8px}
.arow input{flex:1;min-width:0;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff}
.arow input::placeholder{color:#A9BAC6}
.arow .btn{background:var(--saffron);color:#12202E}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:transparent;border:1px solid rgba(255,255,255,.3);color:#E5EDF2;border-radius:999px;padding:5px 12px;font-size:14px}
.chip:hover{background:rgba(255,255,255,.12)}
#aout{margin-top:14px;display:grid;gap:10px}
.arow-res{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--card);color:var(--ink);border-radius:10px;padding:10px}
.arow-res .tile{width:56px;height:56px;border-radius:8px;font-size:28px}
.arow-res small{color:var(--ink2);display:block}
.anote{font-size:13px;color:#A9BAC6}

/* sections */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:36px 0 14px}
.sec-h h2{font-size:26px}
.cat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:28px}
.cat-tile{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px;text-align:left;font-weight:600}
.cat-tile:hover{border-color:var(--teal)}
.cat-tile span{font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.tile{position:relative;display:grid;place-items:center;border:0;width:100%;background:hsl(var(--h) var(--ts) var(--tl));aspect-ratio:4/3;font-size:64px;padding:0}
.tile .off,.tile .eco{position:absolute;top:8px;font:600 12px var(--f-body);padding:3px 8px;border-radius:999px}
.tile .off{left:8px;background:var(--saffron);color:#12202E}
.tile .eco{right:8px;background:#1C8A57;color:#fff}
.pb{padding:12px 14px 14px;display:grid;gap:4px}
.brand{font-size:13px;color:var(--ink2)}
.pb h3{font-size:16px;font-weight:600;letter-spacing:0}
.pb h3 a{text-decoration:none}
.pb h3 a:hover{text-decoration:underline}
.rate{font-size:14px;color:var(--ink2)}
.stars{color:#B7740A;font-weight:600}
:root[data-theme="dark"] .stars{color:var(--saffron)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stars{color:var(--saffron)}}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price b{font:700 20px var(--f-head)}
.price s{color:var(--ink2);font-size:14px}
.prow{display:flex;gap:6px;margin-top:6px;align-items:center}
.prow .btn{flex:1}
.stock{font-size:13px;color:var(--coral);font-weight:500}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;margin:44px 0 20px;border-top:1px solid var(--rule)}
.trust div{padding:20px 20px 4px 0}
.trust h3{font-size:17px;margin-bottom:6px}
.trust p{margin:0;color:var(--ink2);font-size:15px}

/* catalog */
.cat-layout{display:grid;grid-template-columns:240px 1fr;gap:28px;padding-top:24px;align-items:start}
.filters{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px;position:sticky;top:150px}
.filters summary{font:700 17px var(--f-head);cursor:pointer;margin-bottom:8px}
.fg{border-top:1px solid var(--rule);padding:12px 0 4px}
.fg h4{font-size:14px;margin-bottom:8px}
.fg label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:15px}
.fg input[type=range]{width:100%;accent-color:var(--teal)}
.fg input[type=radio],.fg input[type=checkbox]{accent-color:var(--teal);width:16px;height:16px}
.fg select,.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.res-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.res-h select{padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
.empty{background:var(--card);border:1px dashed var(--rule);border-radius:10px;padding:36px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* product page */
.pp{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding-top:24px}
.pp .tile{aspect-ratio:1/1;font-size:150px;border-radius:14px}
.pp h1{font-size:clamp(26px,3.4vw,38px);margin:4px 0 8px}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(28,138,87,.14);color:var(--ok)}
.pbox{border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:16px;margin:16px 0}
.pbox .big{font:800 34px var(--f-head)}
table{border-collapse:collapse;width:100%}
td,th{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--ink2);width:42%}
.brk td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.brk tr.tot td{font-weight:700;border-bottom:0;font-size:17px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-weight:600;font-size:14px}
.field .err{color:var(--coral);font-size:13px;min-height:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.review{border-bottom:1px solid var(--rule);padding:12px 0}
.review p{margin:4px 0 0}
.wide{overflow-x:auto}
.cmpt th,.cmpt td{min-width:160px;width:auto}
.cmpt th:first-child{min-width:120px}
.best{color:var(--ok);font-weight:700}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(8,16,24,.55);z-index:60;display:flex;justify-content:center;align-items:center;padding:16px}
.scrim.right{justify-content:flex-end;align-items:stretch;padding:0}
.dlg{background:var(--card);border-radius:14px;padding:22px;width:min(460px,100%);max-height:calc(100% - 8px);overflow:auto;border:1px solid var(--rule)}
.drawer{width:min(430px,100%);border-radius:0;height:100%;max-height:none;display:flex;flex-direction:column;padding:0}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
.drawer .body{padding:12px 20px;overflow:auto;flex:1}
.drawer footer{padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:center}
.line .tile{width:56px;height:56px;border-radius:8px;font-size:28px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:8px;margin-top:4px}
.qty button{background:none;border:0;width:30px;height:30px}
.qty span{min-width:26px;text-align:center}
.xbtn{background:none;border:0;font-size:22px;line-height:1;padding:4px 8px;border-radius:6px}
.meter{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:var(--coral);transition:width .2s}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 14px;border-bottom:3px solid transparent;font-weight:600;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
.hint{background:rgba(242,163,58,.18);border-radius:8px;padding:8px 12px;font-size:14px}

/* checkout / orders / dashboards */
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;padding-top:24px;align-items:start}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px;margin-bottom:16px}
.panel h2{font-size:20px;margin-bottom:12px}
.pay{display:grid;gap:8px}
.pay label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.pay input{margin-top:4px;accent-color:var(--teal)}
.pay label:has(input:checked){border-color:var(--teal);background:rgba(11,127,134,.07)}
.tl{display:flex;gap:0;margin:14px 0 8px;list-style:none;padding:0}
.tl li{flex:1;text-align:center;font-size:13px;color:var(--ink2);position:relative;padding-top:22px}
.tl li::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--rule);z-index:1}
.tl li::after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--rule)}
.tl li:first-child::after{display:none}
.tl li.done{color:var(--ink)}
.tl li.done::before,.tl li.done::after{background:var(--ok)}
.tl li.now{font-weight:600}
.status{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:20px 0;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
.kpis div{padding:16px;border-right:1px solid var(--rule)}
.kpis div:last-child{border-right:0}
.kpis b{display:block;font:800 26px var(--f-head)}
.kpis span{color:var(--ink2);font-size:14px}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px;padding:10px 0}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--ink2)}
.bars i{display:block;width:100%;background:var(--teal);border-radius:4px 4px 0 0;min-height:4px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item small{color:var(--ink2);display:block}
.num{width:84px;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.sev{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.sev.hi{background:rgba(201,62,34,.15);color:var(--coral)}
.sev.md{background:rgba(242,163,58,.25)}
.back{background:none;border:0;padding:16px 0 0;color:var(--ink2);font-weight:500}

/* chrome */
.tray{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--card);border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.tray .wrap{display:flex;gap:10px;align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.tray .pill{border:1px solid var(--rule);border-radius:999px;padding:4px 6px 4px 12px;display:flex;gap:6px;align-items:center;font-size:14px}
.demo{position:fixed;left:0;right:0;bottom:0;z-index:36;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px);font-size:14px}
:root[data-theme="dark"] .demo{background:#1B2A37;color:#E8EEF2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .demo{background:#1B2A37;color:#E8EEF2}}
.demo .wrap{display:flex;gap:8px;align-items:center;min-height:46px;overflow-x:auto;white-space:nowrap}
.demo button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:3px 12px;opacity:.75}
.demo button[aria-pressed="true"]{background:var(--saffron);border-color:var(--saffron);color:#12202E;opacity:1;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;z-index:90;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
:root[data-theme="dark"] .toast{background:#E8EEF2;color:#12202E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#E8EEF2;color:#12202E}}
main{padding-bottom:150px;outline:none}
footer.site{border-top:1px solid var(--rule);margin-top:40px;padding:24px 0;color:var(--ink2);font-size:14px}
@media (max-width:860px){
  .hero-g,.pp,.two,.cat-layout{grid-template-columns:1fr}
  .filters{position:static}
  .hlbl{display:none}
  .pp .tile{font-size:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="sr" href="#app">Skip to content</a>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#" data-act="go" data-v="home" aria-label="Nexora home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28 6.5v9.2c0 7-4.8 12.2-12 14.3C8.8 27.900 4 22.700 4 15.700V6.500z" fill="#0B7F86"/><path d="M11 22V10l10 12V10" fill="none" stroke="#F2A33A" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"/></svg>
      nexora
    </a>
    <form class="search" id="sform" role="search">
      <label class="sr" for="sq">Search products</label>
      <input id="sq" type="search" placeholder="Search products, brands, or try “phone under 20000”" autocomplete="off">
      <button class="btn" type="submit">Search</button>
      <ul class="sugg" id="sugg" hidden></ul>
    </form>
    <nav class="acts" aria-label="Account and cart">
      <button class="hbtn" data-act="theme" aria-label="Switch light or dark theme">◐</button>
      <button class="hbtn" data-act="go" data-v="wishlist">♥ <span class="hlbl">Wishlist</span> <span class="cnt" id="cW"></span></button>
      <button class="hbtn" data-act="go" data-v="orders">▤ <span class="hlbl">Orders</span></button>
      <button class="hbtn" data-act="cart">🛒 <span class="hlbl">Cart</span> <span class="cnt" id="cC"></span></button>
      <button class="hbtn" data-act="account" id="acct">Sign in</button>
    </nav>
  </div>
  <div class="cats"><div class="wrap" id="catnav"></div></div>
</header>

<main id="app" tabindex="-1"></main>

<div id="tray"></div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div class="demo">
  <div class="wrap">
    <strong>Prototype</strong>
    <span>View as:</span>
    <button data-act="role" data-v="customer" aria-pressed="true">Customer</button>
    <button data-act="role" data-v="seller" aria-pressed="false">Seller</button>
    <button data-act="role" data-v="admin" aria-pressed="false">Administrator</button>
    <button data-act="reset" style="margin-left:auto">Reset demo data</button>
  </div>
</div>

<script>

const $=s=>document.querySelector(s);

const STOP=new Set(['a','an','the','for','with','good','best','me','i','need','want','looking','to','buy','get','show','some','under','below','and','of','in','on','my','friendly','than','less','upto','up','within','is','are','please','cheap','new']);
const SYN={mobile:'phone',smartphone:'phone',cellphone:'phone',earphones:'earbuds',earphone:'earbuds',headphone:'earbuds',headphones:'earbuds',notebook:'laptop',laptops:'laptop',television:'tv',shoe:'shoes',sneaker:'sneakers',moisturizer:'moisturiser',sunscreen:'spf',workout:'fitness',sustainable:'eco',phones:'phone',earbud:'earbuds',kurtas:'kurta'};
function parseBudget(q){
  const m=q.toLowerCase().match(/(?:under|below|within|less than|upto|up to|<)\s*(?:₹|rs\.?|inr)?\s*([\d,]+(?:\.\d+)?)\s*(k|thousand|lakh|lakhs|l)?/);
  if(!m)return {budget:null,rest:q};
  let n=parseFloat(m[1].replace(/,/g,''));
  const u=m[2];
  if(u==='k'||u==='thousand')n*=1000;else if(u&&u!=='k')n*=100000;
  return {budget:n,rest:q.replace(m[0],' ')};
}
function smartSearch(q){
  const {budget,rest}=parseBudget(q);
  const toks=rest.toLowerCase().split(/[^a-z0-9]+/).filter(t=>t&&!STOP.has(t)).map(t=>SYN[t]||t);
  let list=live();
  if(budget)list=list.filter(p=>p.price<=budget);
  if(!toks.length)return {list:list.slice().sort((a,b)=>b.rating-a.rating),budget,toks};
  const need=Math.ceil(toks.length*0.6);
  const scored=list.map(p=>{
    const text=(p.name+' '+p.brand+' '+p.cat+' '+p.tags+(p.eco?' eco':'')).toLowerCase();
    let s=0;toks.forEach(t=>{const stem=t.length>3?t.replace(/s$/,''):t;if(text.includes(stem))s++});
    return {p,s};
  }).filter(x=>x.s>=need).sort((a,b)=>b.s-a.s||b.p.rating-a.p.rating);
  return {list:scored.map(x=>x.p),budget,toks};
}

function cartItems(){return S.cart.map(c=>({p:byId(c.id),qty:c.qty})).filter(x=>x.p)}
function totals(items,coupon){
  let sub=0,mrp=0,gst=0;
  items.forEach(({p,qty})=>{sub+=p.price*qty;mrp+=p.mrp*qty;gst+=(p.price-p.price/(1+p.gst/100))*qty});
  const cd=(coupon==='NEXORA10'&&sub>=999)?Math.min(500,Math.round(sub*0.10)):0;
  const ship=(sub===0||sub-cd>=499)?0:49;
  const total=sub-cd+ship;
  return {sub,mrp,save:mrp-sub,gst,cd,ship,total,points:Math.floor(total/100)};
}

  }
  return `<div class="wrap"><div class="sec-h" style="margin-top:24px"><h2>Administrator dashboard</h2><span class="badge">✓ MFA verified</span></div>
  <div class="kpis"><div><b>${342+S.orders.length}</b><span>Orders today (demo base + new)</span></div><div><b>${inr(gmv)}</b><span>Sales today (demo)</span></div><div><b>${openA}</b><span>Waiting for approval</span></div><div><b>${openF}</b><span>Open trust and fraud items</span></div></div>
  <div class="tabs" role="tablist">${tabs.map(([id,l])=>`<button role="tab" aria-selected="${S.adminTab===id}" data-act="admtab" data-v="${id}">${l}</button>`).join('')}</div>${body}</div>`;

function strength(pw){let s=0;if(pw.length>=8)s++;if(pw.length>=12)s++;if(/[A-Z]/.test(pw)&&/[a-z]/.test(pw))s++;if(/\d/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;return s}

    <div class="tabs" role="tablist" style="margin-top:12px"><button role="tab" aria-selected="${!reg}" data-act="ltab" data-v="in">Sign in</button><button role="tab" aria-selected="${reg}" data-act="ltab" data-v="up">Create account</button></div>
    <form data-form="login" novalidate>
      ${reg?`<div class="field"><label for="ln">Full name</label><input id="ln" autocomplete="name" value="${esc(L.name)}"><div class="err" id="e-ln"></div></div>`:''}
      <div class="field"><label for="le">Email</label><input id="le" type="email" autocomplete="email" value="${esc(L.email)}"><div class="err" id="e-le"></div></div>
      <div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="${reg?'new-password':'current-password'}"><div class="err" id="e-lp"></div>${reg?'<div class="meter"><i id="pm"></i></div><small id="pt" style="color:var(--ink2)">Use 8+ characters with upper and lower case, a number and a symbol.</small>':''}</div>
      <button class="btn" type="submit" style="width:100%">${reg?'Create account':'Sign in'}</button>

/* ---------- assistant ---------- */
function runAssist(text){
  const out=$('#aout');if(!out)return;
  if(!text.trim()){out.innerHTML='<div class="anote">Type what you’re looking for, like “laptop for study under 40000”.</div>';return}
  const r=smartSearch(text);
  const top=r.list.slice(0,3);
  if(!top.length){out.innerHTML=`<div class="arow-res" style="grid-template-columns:1fr"><div><strong>No close match found.</strong><small>Try a higher budget or fewer details, or browse all products.</small></div></div>`;return}
  out.innerHTML=top.map((p,i)=>{
    const first=Object.values(p.specs)[0];
    const why=[r.budget?`Within your ${inr(r.budget)} budget`:'',`rated ${p.rating}★ by ${p.count.toLocaleString('en-IN')} buyers`,first].filter(Boolean).join(' · ');
    return `<div class="arow-res"><div class="tile" style="--h:${p.hue}" aria-hidden="true">${p.emoji}</div><div><strong>${i===0?'Best match: ':''}${esc(p.name)}</strong> · ${inr(p.price)}<small>${esc(why)}</small></div><div style="display:grid;gap:6px"><button class="btn sm" data-act="open" data-id="${p.id}">View</button><button class="btn sec sm" data-act="add" data-id="${p.id}">Add</button></div></div>`;
  }).join('')+`<div class="anote">Prototype assistant: it matches your words to product details with simple rules. The live version would use an AI model and your shopping history, with your consent.</div>`;
}

/* ---------- actions ---------- */
function addToCart(id,qty){
  const p=byId(id);if(!p||p.stock===0)return false;
  const c=S.cart.find(x=>x.id===id);
  if(c){if(c.qty>=p.stock){toast('Only '+p.stock+' available');return false}c.qty+=qty||1}else S.cart.push({id,qty:qty||1});
  save();updateChrome();return true;
}
function toggle(arr,id,max){const i=arr.indexOf(id);if(i>=0){arr.splice(i,1);return false}if(max&&arr.length>=max)return null;arr.push(id);return true}
function act(name,el,e){
  const id=el.dataset.id,v=el.dataset.v;
  switch(name){
    case 'go':go(v);break;
    case 'back':go(S.view==='product'||S.view==='compare'?'catalog':'home');break;
    case 'cat':S.f.cat=v;S.q='';$('#sq').value='';go('catalog');break;
    case 'open':go('product',id);break;
    case 'add':if(addToCart(id)){toast('Added to cart');if(S.view==='home'||true)render()}break;
    case 'buynow':if(addToCart(id)){go('checkout')}break;
    case 'wish':{const r=toggle(S.wish,id);save();toast(r?'Saved to wishlist':'Removed from wishlist');render();break}
    case 'cmp':{const r=toggle(S.cmp,id,3);if(r===null){toast('You can compare up to 3 products');break}render();break}
    case 'clearcmp':S.cmp=[];go('catalog');break;
    case 'alert':{const r=toggle(S.alerts,id);save();toast(r?'We’ll tell you about price drops and restocks (demo)':'Alerts turned off');break}
    case 'pin':{const z=$('#pin').value.trim(),o=$('#pinout'),p=byId(id);
      if(!/^[1-9]\d{5}$/.test(z)){o.style.color='var(--coral)';o.textContent='Enter a valid 6-digit pincode.';break}
      const d=z.startsWith('5')?Math.max(1,p.days-2):p.days;o.style.color='var(--ok)';o.textContent='Delivery to '+z+' by '+fdate(Date.now()+d*86400000)+(p.price>=499?', free.':', ₹49 delivery.');break}
    case 'cart':openCart();break;
    case 'qty':{const c=S.cart.find(x=>x.id===id),p=byId(id);if(!c)break;const n=c.qty+(+v);if(n<1){S.cart=S.cart.filter(x=>x.id!==id)}else if(n>p.stock){toast('Only '+p.stock+' available');break}else c.qty=n;save();openCart();updateChrome();if(S.view==='checkout')render();break}
    case 'rm':S.cart=S.cart.filter(x=>x.id!==id);save();openCart();updateChrome();if(S.view==='checkout')render();break;
    case 'checkout':if(!S.user){S.pending='checkout';L.tab='in';L.step='form';openLogin();toast('Sign in to continue to checkout')}else go('checkout');break;
    case 'account':openLogin();break;
    case 'ltab':L.tab=v;L.step='form';openLogin();break;
    case 'login-back':L.step='form';openLogin();break;
    case 'logout':S.user=null;save();closeModal();toast('Signed out');render();break;
    case 'closeModal':closeModal();break;
    case 'scrim':if(e.target===el)closeModal();break;
    case 'theme':{const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';store.set('theme',d.dataset.theme);break}
    case 'clearf':S.f={cat:'all',max:80000,rating:0,brands:[],authorized:false,eco:false,instock:false,sort:'relevance'};S.q='';$('#sq').value='';render();break;
    case 'clearq':S.q='';$('#sq').value='';render();break;
    case 'assist':runAssist(($('#aq')||{}).value||'');break;
    case 'assist-ex':$('#aq').value=v;runAssist(v);break;
    case 'cancel':{const o=S.orders.find(x=>x.id===id);if(o&&!o.after&&o.stage<2){o.after='cancelled';o.items.forEach(i=>{const p=byId(i.id);if(p)p.stock+=i.qty});S.points=Math.max(0,S.points-o.points);save();toast('Order cancelled');render()}break}
    case 'return':{
      openModal(`<div class="dlg" role="dialog" aria-modal="true" aria-label="Return items"><h2 style="margin-bottom:10px">Return items from ${esc(id)}</h2><form data-form="return" data-id="${esc(id)}"><div class="field"><label for="rr">Reason</label><select id="rr"><option>Damaged or defective</option><option>Not as described</option><option>Wrong item received</option><option>No longer needed</option></select></div><div class="btns"><button class="btn" type="submit">Request return</button><button class="btn sec" type="button" data-act="closeModal">Cancel</button></div></form></div>`);break}
    case 'advance':{const o=S.orders.find(x=>x.id===id);if(!o)break;
      if(!o.after){if(o.stage<4){o.stage++}}
      else if(o.after==='return-requested')o.after='return-pickedup';
      else if(o.after==='return-pickedup'||o.after==='cancelled')o.after='refunded';
      if(o.after==='refunded'&&o.reason!==undefined){o.items.forEach(i=>{const p=byId(i.id);if(p)p.stock+=i.qty});S.points=Math.max(0,S.points-o.points)}
      save();render();break}
    case 'seller-step':{const o=S.orders.find(x=>x.id===id);if(o&&!o.after&&o.stage<2){o.stage++;save();toast(o.stage===1?'Marked as packed':'Marked as shipped');render()}break}
    case 'role':setRole(v);break;
    case 'admtab':S.adminTab=v;render();break;
    case 'adm':adminAction(v,id);break;
    case 'report':openModal(`<div class="dlg" role="dialog" aria-modal="true" aria-label="Report a problem"><h2 style="margin-bottom:10px">Report a problem</h2><form data-form="report" data-id="${esc(id)}"><div class="field"><label for="rp">What’s wrong?</label><select id="rp"><option>Looks counterfeit</option><option>Unsafe product</option><option>Misleading description or price</option><option>Something else</option></select></div><div class="field"><label for="rd">Details</label><textarea id="rd" rows="3" maxlength="400"></textarea></div><div class="btns"><button class="btn" type="submit">Send report</button><button class="btn sec" type="button" data-act="closeModal">Cancel</button></div></form></div>`);break;
    case 'reset':store.clear();location.reload();break;
  }
}
function setRole(r){
  if(r===S.role)return;
  if(r==='admin'){
    openModal(`<div class="dlg" role="dialog" aria-modal="true" aria-label="Administrator verification"><h2 style="margin-bottom:8px">Administrator sign-in</h2><p style="margin:0 0 12px">Administrators must pass multifactor authentication. There is no public way to register as an administrator.</p><div class="hint" style="margin-bottom:12px">Prototype: use code <strong>000000</strong>.</div><form data-form="mfa"><div class="field"><label for="mfa">Authenticator code</label><input id="mfa" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><div class="err" id="e-mfa"></div></div><div class="btns"><button class="btn" type="submit">Verify</button><button class="btn sec" type="button" data-act="closeModal">Cancel</button></div></form></div>`);
    return;
  }
  S.role=r;closeModal();
  if(r==='seller')go('seller');else go('home');
}
function adminAction(v,id){
  const rm=(arr,key)=>arr.find(x=>x.id===id);
  if(v==='appr-app'){const a=rm(A.applicants);a.status='approved';audit('Approved seller application: '+a.name)}
  else if(v==='rej-app'){const a=rm(A.applicants);a.status='rejected';audit('Rejected seller application: '+a.name)}
  else if(v==='appr-prod'){const p=byId(id);p.status='live';audit('Approved listing: '+p.name)}
  else if(v==='rej-prod'){const p=byId(id);audit('Rejected listing: '+p.name);P=P.filter(x=>x.id!==id)}
  else if(v==='fraud-act'){const f=rm(A.fraud);f.status='done';audit('Applied: '+f.action)}
  else if(v==='fraud-dis'){const f=rm(A.fraud);f.status='dismissed';audit('Dismissed alert: '+f.what)}
  else if(v==='rev-rm'){const f=rm(A.flagged);f.status='removed';audit('Removed flagged review on '+f.product)}
  else if(v==='rev-keep'){const f=rm(A.flagged);f.status='kept';audit('Kept flagged review on '+f.product+' after review')}
  else if(v==='tkt'){const t=rm(A.tickets);t.status='resolved';audit('Resolved '+t.id)}
  render();toast('Done. Recorded in the audit log.');
}

/* ---------- form handling ---------- */
function setErr(id,msg){const e=$('#e-'+id);if(e)e.textContent=msg||'';return !msg}
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='login'){
    const reg=L.tab==='up';
    const email=$('#le').value.trim(),pw=$('#lp').value,name=reg?$('#ln').value.trim():'';
    let ok=true;
    if(reg)ok=setErr('ln',name.length<2?'Enter your full name.':'')&&ok;
    ok=setErr('le',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'':'Enter a valid email address.')&&ok;
    ok=setErr('lp',(reg?strength(pw)>=3&&pw.length>=8:pw.length>=8)?'':(reg?'Choose a stronger password: 8+ characters with upper and lower case plus a number or symbol.':'Enter your password (at least 8 characters).'))&&ok;
    if(!ok)return;
    L.email=email;L.name=name||email.split('@')[0];L.step='otp';L.tries=0;openLogin();
  }else if(f==='otp'){
    if(Date.now()<L.lockUntil){setErr('otp','Too many attempts. Try again in '+Math.ceil((L.lockUntil-Date.now())/1000)+' seconds.');return}
    const code=$('#otp').value.trim();
    if(code!=='123456'){L.tries++;if(L.tries>=5){L.lockUntil=Date.now()+30000;L.tries=0;setErr('otp','Too many attempts. Locked for 30 seconds.')}else setErr('otp','That code isn’t right. '+(5-L.tries)+' attempts left.');return}
    S.user={name:L.name.replace(/\b\w/g,c=>c.toUpperCase()),email:L.email};L.step='form';save();closeModal();toast('Signed in. Welcome to Nexora!');
    if(S.pending==='checkout'){S.pending=null;go('checkout')}else render();
  }else if(f==='mfa'){
    if($('#mfa').value.trim()!=='000000'){setErr('mfa','That code isn’t right.');return}
    S.role='admin';closeModal();audit('Administrator signed in with MFA');go('admin');
  }else if(f==='coupon'){
    const c=$('#cpn').value.trim().toUpperCase();
    if(!c){S.coupon=null;openCart();return}
    if(c==='NEXORA10'){const t=totals(cartItems(),'NEXORA10');if(t.sub<999){S.coupon=null;openCart();toast('NEXORA10 needs a cart of ₹999 or more');return}S.coupon=c;openCart();toast('Coupon applied: 10% off, up to ₹500')}
    else{S.coupon=null;openCart();toast('That coupon code isn’t valid')}
    if(S.view==='checkout')render();
  }else if(f==='checkout'){
    if(S.placing)return;
    const v=id=>$('#'+id).value.trim();
    let ok=true;
    ok=setErr('cn',v('cn').length<2?'Enter your full name.':'')&&ok;
    ok=setErr('cp',/^[6-9]\d{9}$/.test(v('cp'))?'':'Enter a 10-digit Indian mobile number.')&&ok;
    ok=setErr('ca',v('ca').length<6?'Enter your full address.':'')&&ok;
    ok=setErr('cc',v('cc').length<2?'Enter your city.':'')&&ok;
    ok=setErr('cz',/^[1-9]\d{5}$/.test(v('cz'))?'':'Enter a valid 6-digit pincode.')&&ok;
    const pay=document.querySelector('input[name=pay]:checked').value;S.pay=pay;
    const items=cartItems(),t=totals(items,S.coupon);
    if(pay==='upi')ok=setErr('upi',/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v('upi'))?'':'Enter a valid UPI ID like name@bank.')&&ok;
    if(pay==='cod'&&t.total>50000){toast('Cash on delivery is available up to ₹50,000. Choose UPI or card.');ok=false}
    if(items.some(({p,qty})=>qty>p.stock)){toast('Some items are no longer available in that quantity. Check your cart.');ok=false}
    if(!ok){const first=document.querySelector('.err:not(:empty)');if(first)first.previousElementSibling.focus();return}
    S.placing=true;const b=$('#placeBtn');b.disabled=true;b.textContent='Confirming payment…';
    setTimeout(()=>{
      const o={id:'NX'+Date.now().toString().slice(-7),at:Date.now(),stage:0,after:null,pay,total:t.total,points:t.points,eta:Math.max(...items.map(x=>x.p.days)),
        items:items.map(({p,qty})=>({id:p.id,name:p.name,price:p.price,qty,emoji:p.emoji})),addr:v('ca')+', '+v('cc')+' '+v('cz')};
      items.forEach(({p,qty})=>{p.stock-=qty});
      S.orders.unshift(o);S.points+=t.points;S.cart=[];S.coupon=null;S.placing=false;save();
      toast('Order '+o.id+' placed. You earned '+t.points+' points.');go('orders');
    },1400);
  }else if(f==='return'){
    const o=S.orders.find(x=>x.id===e.target.dataset.id);
    if(o&&!o.after&&o.stage===4){o.after='return-requested';o.reason=$('#rr').value;save();closeModal();toast('Return requested');render()}
  }else if(f==='review'){
    const pid=e.target.dataset.id,text=$('#rt').value.trim();if(!text)return;
    (S.reviews[pid]=S.reviews[pid]||[]).unshift({name:S.user.name,stars:+$('#rs').value,text,verified:true});save();toast('Review posted. Thank you!');render();
  }else if(f==='addprod'){
    const name=$('#np').value.trim(),cat=$('#nc').value,mrp=+$('#nm').value,stock=+$('#ns').value;
    if(!name||!(mrp>0)||stock<0)return;
    const p=mk(name,'Hyderabad Digital Hub',cat,mrp,0,4.0,0,'S1',CATS.find(c=>c.id===cat).ic,200,stock,4,'', false,cat+' new',{'Listing status':'Awaiting approval'});
    p.status='pending';p.id='p'+(100+P.length);P.push(p);toast('Submitted for approval');render();
  }else if(f==='report'){
    const p=byId(e.target.dataset.id);
    const idn='TKT-'+(1045+A.tickets.length-3);
    A.tickets.push({id:idn,who:'Customer report',what:$('#rp').value+' on “'+p.name+'”'+($('#rd').value.trim()?': '+$('#rd').value.trim():''),status:'open'});
    closeModal();toast('Report received. Reference '+idn);
  }
});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='A')e.preventDefault();
  if(el.type==='checkbox'&&el.dataset.act==='alert'){act('alert',el,e);return}
  act(el.dataset.act,el,e);
  if(!e.target.closest('#sform'))$('#sugg').hidden=true;
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='lp'&&$('#pm')){const s=strength(t.value);$('#pm').style.width=(s*20)+'%';$('#pm').style.background=s<3?'var(--coral)':s<5?'var(--saffron)':'var(--ok)';$('#pt').textContent=s<3?'Weak. Add length, capitals, numbers or symbols.':s<5?'Good. A longer password with a symbol is even better.':'Strong password.'}
  if(t.closest&&t.closest('.filters')&&(t.id==='fmax'))readFilters();
  if(t.id==='sq')suggest(t.value);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.closest&&t.closest('.filters')||t.id==='fsort')readFilters();
  if(t.name==='pay'){S.pay=t.value;const u=$('#upiF');if(u)u.hidden=t.value!=='upi'}
  if(t.dataset&&t.dataset.stock){const p=byId(t.dataset.stock);p.stock=Math.max(0,Math.min(9999,parseInt(t.value,10)||0));toast('Stock updated for '+p.name);render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();$('#sugg').hidden=true}
  if(e.key==='Enter'&&e.target.id==='aq'){e.preventDefault();runAssist(e.target.value)}
});
document.addEventListener('click',e=>{if(!e.target.closest('#sform'))$('#sugg').hidden=true});

function suggest(q){
  const u=$('#sugg');q=q.trim().toLowerCase();
  if(q.length<2){u.hidden=true;return}
  const m=live().filter(p=>(p.name+' '+p.brand).toLowerCase().includes(q)).slice(0,5);
  if(!m.length){u.hidden=true;return}
  u.innerHTML=m.map(p=>`<li><button type="button" data-act="open" data-id="${p.id}">${p.emoji} ${esc(p.name)} <small style="color:var(--ink2)">in ${esc(CATS.find(c=>c.id===p.cat).name)}</small></button></li>`).join('');
  u.hidden=false;
}
$('#sform').addEventListener('submit',e=>{
  e.preventDefault();S.q=$('#sq').value.trim();S.f.cat='all';$('#sugg').hidden=true;go('catalog');
});

/* ---------- boot ---------- */
(function(){const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th})();
render();
</script>
</body>
</html>
